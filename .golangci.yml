version: "2"

run:
  timeout: 10m

output:
  sort-results: true

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives

    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - staticcheck
    - spancheck
    - sqlclosecheck
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
    - zerologlint
  settings:
    funlen:
      lines: 120
      statements: 60
    lll:
      line-length: 120
    cyclop:
      max-complexity: 20
    nestif:
      min-complexity: 8
    mnd:
      ignored-numbers: [0, 1, 2]
    varnamelen:
      ignore-names: [ok, err, id, db, tx, i, j, n, w, r]
    gosec:
      excludes:
        - G304 # config/state paths are user-provided by design
        - G301 # perms handled explicitly with 0o700/0o600
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    wrapcheck:
      ignoreSigs:
        - .Errorf(
        - errors.New(
        - errors.Wrap(
        - errors.Wrapf(
        - fmt.Errorf(
        - tgerr.
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    rules:
      - path: internal/filters/options\.go
        linters:
          - lll # struct-tag lines cannot be wrapped
      - path: _test\.go
        linters:
          - funlen
          - lll
          - dupl
          - gochecknoglobals
          - err113
          - wrapcheck
          - mnd
          - varnamelen
          - cyclop
          - nestif
          - paralleltest
          - gosec
          - maintidx
          - wsl
      - path: cmd/teleparse/main\.go
        linters:
          - err113

formatters:
  enable:
    - gofumpt
    - goimports
